- id: '1772006878200'
  alias: CO2 Ventilation LED
  description: Red LED and notify when CO2 is high, LED off when OK
  triggers:
  - trigger: numeric_state
    entity_id: sensor.co2_temp_lux_toren_co2
    above: 1200
    id: high
  - trigger: numeric_state
    entity_id: sensor.co2_temp_lux_toren_co2
    below: 1200
    id: ok
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - high
      sequence:
      - action: notify.mobile_app_iphone_14_pro_stijn
        metadata: {}
        data:
          message: Ventileren noodzakelijk Co2 boven 1200 ppm
      - action: light.turn_on
        metadata: {}
        target:
          entity_id: light.co2_temp_lux_toren_rgb_led
        data:
          rgb_color:
          - 241
          - 9
          - 9
    - conditions:
      - condition: trigger
        id:
        - ok
      sequence:
      - action: light.turn_off
        metadata: {}
        target:
          entity_id: light.co2_temp_lux_toren_rgb_led
        data: {}
  mode: single
