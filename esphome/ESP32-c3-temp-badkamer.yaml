substitutions:
  name: temp-badkamer
  friendly_name: Temp Badkamer


packages:
  esp32-c3-idf: !include Common/esp32-c3.yaml


one_wire:
  - platform: gpio
    pin: GPIO0
    id: x1
#  - platform: gpio
#    pin: GPIO10
#    id: x2
    
sensor:
  - platform: dallas_temp
    one_wire_id: x1
    name: Temp TEST
    update_interval: 30s
#  - platform: dallas_temp
#    one_wire_id: x2
#    name: Temp aanvoer rood
#    update_interval: 30s

#  - platform: sht4x
#    address: 0x44
#    temperature:
#      name: Temperatuur trapkast
#    humidity:
#      name: Vochtigheid trapkast
#    update_interval: 30s


light:
   - platform: esp32_rmt_led_strip
     rgb_order: GRB
     pin: GPIO01
     num_leds: 60
     chipset: ws2812
     rmt_symbols: 64
     id: led_strip
     name: Test led strip
     effects:
      # Use default parameters:
      - random:
      # Customize parameters
      - random:
          name: "My Slow Random Effect"
          transition_length: 30s
          update_interval: 30s
      - random:
          name: "My Fast Random Effect"
          transition_length: 4s
          update_interval: 5s
      - pulse:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          name: "Slow Pulse"
          transition_length: 500ms
          update_interval: 2s
      - pulse:
          name: "Asymmetrical Pulse"
          transition_length:
            on_length: 1s
            off_length: 500ms
          update_interval: 1.5s
      - addressable_rainbow:
      - addressable_rainbow:
          name: Rainbow Effect With Custom Values
          speed: 10
          width: 50
      - addressable_color_wipe:
      - addressable_color_wipe:
          name: Color Wipe Effect With Custom Values
          colors:
            - red: 100%
              green: 100%
              blue: 100%
              num_leds: 5
              gradient: true
            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 1
          add_led_interval: 100ms
          reverse: false
      - addressable_scan:
      - addressable_scan:
          name: Scan Effect With Custom Values
          move_interval: 100ms
          scan_width: 1
      - addressable_twinkle:
      - addressable_twinkle:
          name: Twinkle Effect With Custom Values
          twinkle_probability: 5%
          progress_interval: 4ms
      - addressable_fireworks:
      - addressable_fireworks:
          name: Fireworks Effect With Custom Values
          update_interval: 32ms
          spark_probability: 10%
          use_random_color: false
          fade_out_rate: 120